# Update 11: each morning, settles today's Member of the Day and emails them.
# Uses the same two repository secrets as the course emails: SITE_URL and CRON_SECRET. Until both are set, the job skips quietly.
name: Member of the Day
on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Email today's Member of the Day
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Not set up yet"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/member-of-the-day"
