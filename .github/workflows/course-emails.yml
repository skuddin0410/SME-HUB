# Update 4: the daily course emails (drip lessons, reminders, instructor digest).
# Needs two repository secrets: SITE_URL (for example https://smehub.ca) and CRON_SECRET (the same value as the
# CRON_SECRET server setting in AWS Amplify). Until both are set, the job skips quietly.
name: Course emails
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send today's course emails
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Not set up yet"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/courses"
