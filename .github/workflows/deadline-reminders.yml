# Update 13: each morning, sends deadline reminders (bell and email) 14, 7 or 1 day before, as each member chose.
# Uses the same two repository secrets as the course emails: SITE_URL and CRON_SECRET. Until both are set, the job skips quietly.
name: Deadline reminders
on:
  schedule:
    - cron: "40 11 * * *"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send today's deadline reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Not set up yet"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/deadlines"
